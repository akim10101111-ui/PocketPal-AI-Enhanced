name: PocketPal quality checks

on:
  push:
    paths:
      - 'fixes/**'
      - 'pocketpal-source/**'
      - '.github/workflows/quality-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select committed source tree
        run: |
          PROJECT_DIR="$GITHUB_WORKSPACE/pocketpal-source"
          if [ ! -f "$PROJECT_DIR/package.json" ] || [ ! -f "$PROJECT_DIR/android/gradlew" ]; then
            echo "::error::Committed PocketPal source tree is incomplete"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.21.0'

      - name: Install dependencies
        run: |
          cd "$PROJECT_DIR"
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn install --frozen-lockfile

      - name: TypeScript type check
        run: |
          cd "$PROJECT_DIR"
          yarn typecheck

      - name: Format and lint changed TypeScript files
        run: |
          cd "$PROJECT_DIR"
          yarn prettier --write src/utils/deviceCapabilities.ts src/utils/__tests__/deviceCapabilities.test.ts src/screens/BenchmarkScreen/BenchmarkScreen.tsx src/screens/BenchmarkScreen/__tests__/BenchmarkScreen.test.tsx src/hooks/useMemoryCheck.ts src/hooks/__tests__/useMemoryCheck.test.ts src/store/ModelStore.ts src/screens/ModelsScreen/ModelCard/styles.ts src/screens/BenchmarkScreen/styles.ts src/services/deviceRules/selection.ts src/services/deviceRules/__tests__/selection.test.ts
          yarn eslint src/utils/deviceCapabilities.ts src/utils/__tests__/deviceCapabilities.test.ts src/screens/BenchmarkScreen/BenchmarkScreen.tsx src/screens/BenchmarkScreen/__tests__/BenchmarkScreen.test.tsx src/hooks/useMemoryCheck.ts src/hooks/__tests__/useMemoryCheck.test.ts src/store/ModelStore.ts src/screens/ModelsScreen/ModelCard/styles.ts src/screens/BenchmarkScreen/styles.ts src/services/deviceRules/selection.ts src/services/deviceRules/__tests__/selection.test.ts

      - name: Run focused tests
        run: |
          cd "$PROJECT_DIR"
          yarn jest --runInBand --coverage=false --runTestsByPath src/utils/__tests__/deviceCapabilities.test.ts src/screens/BenchmarkScreen/__tests__/BenchmarkScreen.test.tsx src/hooks/__tests__/useMemoryCheck.test.ts src/services/deviceRules/__tests__/selection.test.ts
