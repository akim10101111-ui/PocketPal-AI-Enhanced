name: PocketPal Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'pocketpal-source/**'
      - '.github/workflows/android-apk.yml'

# Keep only one APK build active for this branch. Older builds from before
# this concurrency rule are cancelled explicitly by the first job step.
concurrency:
  group: pocketpal-android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cancel superseded Android APK builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs?status=in_progress&per_page=100" \
            --jq '.workflow_runs[] | select(.path == ".github/workflows/android-apk.yml") | .id' |
          while IFS= read -r stale_run_id; do
            [ -n "$stale_run_id" ] || continue
            [ "$stale_run_id" = "$GITHUB_RUN_ID" ] && continue
            echo "Cancelling superseded Android APK run $stale_run_id"
            gh api --silent --method POST \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${stale_run_id}/cancel" || true
          done

      - name: Locate committed source tree
        run: |
          ROOT_DIR="$GITHUB_WORKSPACE/pocketpal-source"
          PROJECT_DIR="$ROOT_DIR/android"
          if [ ! -f "$ROOT_DIR/package.json" ] || [ ! -f "$PROJECT_DIR/gradlew" ]; then
            echo "::error::Committed PocketPal source tree is incomplete"
            exit 1
          fi
          echo "ROOT_DIR=$ROOT_DIR" >> "$GITHUB_ENV"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Building committed source from $ROOT_DIR"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            pocketpal-source/android/gradle/wrapper/gradle-wrapper.properties
            pocketpal-source/android/gradle.properties
            pocketpal-source/android/settings.gradle
            pocketpal-source/android/build.gradle
            pocketpal-source/android/app/build.gradle
            pocketpal-source/yarn.lock

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.21.0'
          cache: yarn
          cache-dependency-path: pocketpal-source/yarn.lock

      - name: Install JavaScript dependencies
        run: |
          cd "$ROOT_DIR"
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn install --frozen-lockfile

      - name: Cache llama.rn CMake build tree
        uses: actions/cache@v4
        with:
          path: pocketpal-source/node_modules/llama.rn/android/.cxx
          key: ${{ runner.os }}-pocketpal-cxx-${{ hashFiles('pocketpal-source/yarn.lock', 'pocketpal-source/patches/**') }}
          restore-keys: |
            ${{ runner.os }}-pocketpal-cxx-

      - name: Set up native compiler cache
        uses: ./pocketpal-source/.github/actions/setup-ccache

      - name: Create temporary Firebase config for CI build
        run: |
          APP_GRADLE="$PROJECT_DIR/app/build.gradle"
          PACKAGE_NAME="$(sed -n -E 's/^[[:space:]]*applicationId[[:space:]]+"([^"]+)".*/\1/p' "$APP_GRADLE" | head -n 1)"
          if [ -z "$PACKAGE_NAME" ]; then
            echo "::error::Could not determine the production Android application ID"
            exit 1
          fi
          cat > "$PROJECT_DIR/app/google-services.json" <<EOF
          {
            "project_info": {
              "project_number": "123456789012",
              "project_id": "pocketpal-ci-placeholder",
              "storage_bucket": "pocketpal-ci-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789012:android:abcdef1234567890",
                  "android_client_info": {
                    "package_name": "$PACKAGE_NAME"
                  }
                },
                "api_key": [
                  {
                    "current_key": "AIzaSyCIPocketPalCiBuildPlaceholder000000000"
                  }
                ]
              }
            ],
            "configuration_version": "1"
          }
          EOF
          echo "Temporary Firebase metadata generated for $PACKAGE_NAME (CI only; no live Firebase credentials)."

      - name: Run Android unit tests and build production debug APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace --build-cache --console=plain --max-workers=4 \
            -PreactNativeArchitectures=arm64-v8a \
            testProdDebugUnitTest assembleProdDebug

      - name: Upload Android unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PocketPal-android-test-reports
          path: pocketpal-source/android/app/build/test-results/testProdDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14

      - name: Verify APK and signature
        run: |
          APK_DIR="$PROJECT_DIR/app/build/outputs/apk/prod/debug"
          APK_PATH="$(find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' -print -quit)"
          if [ -z "$APK_PATH" ]; then
            echo "::error::prodDebug build completed without producing an APK"
            find "$PROJECT_DIR/app/build/outputs/apk" -maxdepth 5 -type f -print || true
            exit 1
          fi

          ANDROID_SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          APKSIGNER="$(command -v apksigner || find "$ANDROID_SDK/build-tools" -type f -name apksigner -print 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ]; then
            echo "::error::Android apksigner was not found; cannot verify APK signature"
            exit 1
          fi

          "$APKSIGNER" verify --verbose --print-certs "$APK_PATH"
          sha256sum "$APK_PATH"
          ls -lh "$APK_PATH"
          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"

      - name: Upload verified APK
        id: upload-apk
        uses: actions/upload-artifact@v4
        with:
          name: PocketPal-prodDebug-arm64
          path: pocketpal-source/android/app/build/outputs/apk/prod/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Delete outdated APK artifacts
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_ARTIFACT_ID: ${{ steps.upload-apk.outputs.artifact-id }}
        run: |
          set -euo pipefail
          if [ -z "${CURRENT_ARTIFACT_ID:-}" ]; then
            echo "::error::The new APK artifact ID is missing; refusing to delete existing artifacts."
            exit 1
          fi

          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name == "PocketPal-prodDebug-arm64") | .id' |
          while IFS= read -r artifact_id; do
            [ -n "$artifact_id" ] || continue
            [ "$artifact_id" = "$CURRENT_ARTIFACT_ID" ] && continue
            echo "Deleting outdated APK artifact $artifact_id"
            gh api --silent --method DELETE \
              "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
          done
