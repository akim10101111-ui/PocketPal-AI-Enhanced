name: PocketPal Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'pocketpal-ai-improved-v3.zip'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract bundled project
        run: |
          unzip -q pocketpal-ai-improved-v3.zip -d extracted
          GRADLEW="$(find extracted -type f -name gradlew -print -quit)"
          if [ -z "$GRADLEW" ]; then
            echo "::error::No gradlew found inside bundled ZIP"
            find extracted -maxdepth 4 -type f | head -200
            exit 1
          fi
          PROJECT_DIR="$(dirname "$GRADLEW")"
          ROOT_DIR="$(dirname "$PROJECT_DIR")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "ROOT_DIR=$ROOT_DIR" >> "$GITHUB_ENV"
          echo "Detected Android project at: $PROJECT_DIR"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.21.0'

      - name: Install JS dependencies (if needed)
        run: |
          cd "$ROOT_DIR"
          if [ -f package.json ]; then
            corepack enable
            if grep -q '"packageManager": *"yarn@' package.json; then
              corepack prepare "$(node -p "require('./package.json').packageManager")" --activate
            else
              npm install --global yarn
            fi
            if [ -f yarn.lock ]; then
              yarn install --frozen-lockfile
            elif [ -f package-lock.json ]; then
              npm ci
            else
              yarn install
            fi
          fi

      - name: Create temporary Firebase config for CI build
        run: |
          APP_GRADLE="$PROJECT_DIR/app/build.gradle"
          PACKAGE_NAME="$(grep -E '^[[:space:]]*applicationId[[:space:]]+' "$APP_GRADLE" | head -1 | sed -E 's/^[[:space:]]*applicationId[[:space:]]+["]?([^" ]+).*/\\1/')"
          if [ -z "$PACKAGE_NAME" ]; then
            PACKAGE_NAME="$(grep -E '^[[:space:]]*namespace[[:space:]]+' "$APP_GRADLE" | head -1 | sed -E 's/^[[:space:]]*namespace[[:space:]]+["]?([^" ]+).*/\\1/')"
          fi
          if [ -z "$PACKAGE_NAME" ]; then
            echo "::error::Could not determine Android application package"
            exit 1
          fi
          cat > "$PROJECT_DIR/app/google-services.json" <<EOF
          {
            "project_info": {
              "project_number": "123456789012",
              "project_id": "ci-placeholder",
              "storage_bucket": "ci-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789012:android:abcdef1234567890",
                  "android_client_info": { "package_name": "$PACKAGE_NAME" }
                },
                "api_key": [ { "current_key": "CI_PLACEHOLDER_API_KEY" } ]
              }
            ],
            "configuration_version": "1"
          }
          EOF
          echo "Generated temporary placeholder Firebase config for $PACKAGE_NAME (CI only)."

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PocketPal-debug-apk
          path: ${{ env.PROJECT_DIR }}/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
